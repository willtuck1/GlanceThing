name: Build GlanceThing Release

# Tag pushes only. Creating a release on GitHub also creates its tag, so a
# second 'release: created' trigger ran the build twice at once, and the two
# runs collided uploading the same files (v0.0.16-tabs.5 lost its client zip).
on:
  push:
    tags:
      - 'v*-tabs.*'
  workflow_dispatch:

# One build per tag at a time; a second run for the same tag waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GT_REPO: ${{ vars.GT_REPO || github.repository }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  # Release title: GlanceThing_v0.NN, one more than the number of existing
  # releases (this tag's own release excluded, so re-runs keep the name).
  # The tag stays v0.0.16-tabs.N; the in-app update check reads the tag.
  release-name:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.name.outputs.name }}
    steps:
      - id: name
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate \
            --jq "[.[] | select(.tag_name != \"$TAG\")] | length" | awk '{s+=$1} END {print s+0}')
          printf 'name=GlanceThing_v0.%02d\n' "$((count + 1))" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: release-name
    runs-on: windows-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glancething-windows-${{ github.ref_name }}
          path: ./dist/glancething-*-setup.exe

      - name: Upload to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.release-name.outputs.name }}
          files: ./dist/glancething-*-setup.exe

  build-macos:
    needs: release-name
    runs-on: macos-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build:mac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glancething-macos-${{ github.ref_name }}
          path: ./dist/glancething-*.dmg

      - name: Upload to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.release-name.outputs.name }}
          files: ./dist/glancething-*.dmg

  build-linux:
    needs: release-name
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build:linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glancething-linux-${{ github.ref_name }}
          path: ./dist/glancething-*.AppImage

      - name: Upload to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.release-name.outputs.name }}
          files: ./dist/glancething-*.AppImage

  build-client:
    needs: release-name
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build

      - name: Zip the build output
        run: zip -r /tmp/glancething-client-${{ github.ref_name }}.zip ./*
        working-directory: ./client/dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glancething-client-${{ github.ref_name }}
          path: ./client/dist

      - name: Upload to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.release-name.outputs.name }}
          files: /tmp/glancething-client-*.zip
